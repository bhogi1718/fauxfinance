<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APPLE</title>
    <link rel="icon" href="TradeTact.png" type="image/x-icon">
    <style>
      /*body{
        background-color: #121212;
        color: #fff; /* Text color for better contrast
      } */
      #navbar{
    list-style-type: none;
    margin:0;
    padding: 0;
    display:flex ;
}

#logo{
    height:70% ;
    width: 50%;
    margin-top: 20px;
    margin-left: 50px;
}

#bell{
    height: 30px;
    width: 30px;
    margin-left: 40px;
    margin-right: 40px;
    margin-top: 40px;
    cursor: pointer;
}

#usericon{
    height: 30px;
    width: 30px;
    margin-top: 40px;
    cursor: pointer;
}

#wallet{
    height: 30px;
    width: 30px;
    margin-right: 50px;
    margin-top: 40px;
    cursor: pointer;
}
#explore{
    margin-top: 40px;
}

#Investments{
    margin-left: 20px;
    margin-right: 20px;
    margin-top: 40px;
    cursor: pointer;
}

#searchbar1{
    width: 300px;
    height: 30px;
    border: none;
    background-image:url('searchicon.jpg');
    background-repeat:no-repeat;
    background-size:20px 20px;
    background-position: 0px 5px;
    margin-right: 25px;
    margin-top: 40px;
    cursor: pointer;
}

a:link{
    text-decoration: none;
}

#explorebody{
    margin-top: 40px;
    margin-left: 10%;
    margin-right:20%;
}

#index{
    color:#44475b;
    font-size: 20px;
}

#explorebutton{
    background-color: white;
    color:black;
    border: none;
    cursor: pointer;
}

#investbutton{
    background-color: white;
    color:black;
    border: none;
    cursor: pointer;
}
      
      ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      li {
        margin-right: 20px; /* Adjust spacing between options */
      }
      li a {
        color: #fff;
        text-decoration: none; /* Remove underline */
      }
      li a:hover {
        text-decoration: underline; /* Add underline on hover for other links */
      }
      input[type="text"] {
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #fff;
      }
      input[type="submit"] {
        padding: 5px 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
      }
      .buy-btn {
        background-color: green;
        color: #fff;
      }
      .sell-btn {
        background-color: red;
        color: #fff;
      }
      input[type="submit"]:hover {
        opacity: 0.8;
      }

      /* Adjustments for the layout */
      .widget-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }
      .widget-container .tradingview-widget-container {
        width: calc(50% - 10px); /* Adjust width to leave space between widgets */
      }
      .tradingview-widget-container__widget {
        height: 600px; /* Adjust height for better visibility */
      }
      .chart-container {
        height: 700px; /* Adjust the height of the chart container */
      }
    </style>
    <link rel="stylesheet" href="footer.css">
    <script src="js1.js"></script>
</head>
<body>
  <header>
    <ul id="navbar">
        <li><img src="logo1.png" alt="Fauxfinance" id="logo"></li>
        <li id="explore"><button id="explorebutton">Explore</button></li>
        <li id="Investments"><button id="investbutton">Investments</button></li>
        <li><input type="text" id="searchbar1" placeholder="        What are you searching for?"></li>
        <li><img src="bell1.png" id="bell"></li>
        <li><img src ="wallet.png" id="wallet"></li>
        <li><img src = "user icon.png" id="usericon"></li>
    </ul>
</header>
<!-- Chart BEGIN -->
<div class="chart-container">
  <div class="tradingview-widget-container" style="height:calc(100% - 32px);width:100%">
    <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
    {
    "autosize": true,
    "symbol": "NASDAQ:AAPL",
    "interval": "D",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "calendar": false,
    "support_host": "https://www.tradingview.com"
    }
    </script>
  </div>
</div>
<!-- Chart END -->

<!-- Buy and Sell Buttons -->
<div style="text-align: center; margin-top: 20px;">
  <input type="submit" class="buy-btn" value="Buy">
  <input type="submit" class="sell-btn" value="Sell">
</div>

<!-- Fundamentals and Technicals BEGIN -->
<div class="widget-container">
  <!-- Fundamentals -->
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-financials.js" async>
    {
    "isTransparent": false,
    "largeChartUrl": "",
    "displayMode": "regular",
    "width": "100%",
    "height": 600,
    "colorTheme": "dark",
    "symbol": "NASDAQ:AAPL",
    "locale": "en"
    }
    </script>
  </div>
  <!-- Technicals -->
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
    {
    "interval": "1m",
    "width": "100%",
    "height": 600,
    "isTransparent": false,
    "symbol": "NASDAQ:AAPL",
    "showIntervalTabs": true,
    "displayMode": "single",
    "locale": "en",
    "colorTheme": "dark"
    }
    </script>
  </div>
</div>
<!-- Fundamentals and Technicals END -->
<footer>
  <div class="content-box">
      <div class="content-head">
          <h1>About</h1>
      </div>
      <div class="content-body">
          <p> content </p>
      </div>
      <div class="icons">
          <span><i class="fa fa-facebook" aria-hidden="true"></i></span>
          <span><i class="fa fa-twitter" aria-hidden="true"></i></span>
          <span><i class="fa fa-instagram" aria-hidden="true"></i></span>
          <span><i class="fa fa-youtube" aria-hidden="true"></i></span>

      </div>
  </div>
  <div class="content-box">
      <div class="content-head">
          <h1>Address</h1>
      </div>
      <div class="content-body">
          <p><i class="fa fa-map-marker" aria-hidden="true"></i>
              <span>Aseb</span> </p>
          <p><i class="fa fa-phone" aria-hidden="true"></i>
              <span>+911XXXXXXXX</span> </p>
          <p><i class="fa fa-envelope" aria-hidden="true"></i>
              <span> abc@gmail.com</span> </p>
      </div>
  </div>
  <div class="content-box">
      <div class="content-head">
          <h1>Contact Us</h1>
      </div>
      <div class="content-body">
          <form action="">
              <input type="text" placeholder="Enter Name"> <br>
              <input type="email" placeholder="xyz@gmail.com"> <br>
              <textarea name="" id="" cols="20" rows="3" placeholder="Enter Message"></textarea><br>
              <button type="Submit">Submit</button>
          </form>
      </div>
  </div>
  
</footer>

</body>
</html>
