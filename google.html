<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" href="TradeTact.png" type="image/x-icon">
    <style>
      body{
        background-color: #121212;
        color: #fff; /* Text color for better contrast */
      }
      .bell, .wallet, .cart, .hlogo, .flogo {
        border-radius: 10px;
      }
      ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      li {
        margin-right: 20px; /* Adjust spacing between options */
      }
      li a {
        color: #fff;
        text-decoration: none; /* Remove underline */
      }
      li a:hover {
        text-decoration: underline; /* Add underline on hover for other links */
      }
      input[type="text"] {
        padding: 5px;
        border-radius: 5px;
        border: 1px solid #fff;
      }
      input[type="submit"] {
        padding: 5px 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
      }
      .buy-btn {
        background-color: green;
        color: #fff;
      }
      .sell-btn {
        background-color: red;
        color: #fff;
      }
      input[type="submit"]:hover {
        opacity: 0.8;
      }

      /* Adjustments for the layout */
      .widget-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }
      .tradingview-widget-container {
        width: 100%;
      }
      .tradingview-widget-container__widget {
        height: 800px; /* Adjust height for better visibility */
      }
      .chart-container {
        height: 800px; /* Adjust the height of the chart container */
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px; /* Added margin bottom for spacing */
      }
      .financials-container, .technicals-container {
        width: 50%; /* Adjusted to 50% width each for proper alignment */
        box-sizing: border-box; /* Include padding and border in width calculation */
        padding: 10px; /* Add padding for spacing */
      }
    </style>
    <script src="js1.js"></script>
</head>
<body>
    <header>
        <ul>
            <li><img class="hlogo" src="TradeTact.png" height="100px" width="100px"></li>
            <li><a href="#"><img class="search" src="search.gif" height="50px" width="50px"></a></li>
            <li><a href="#">Holdings</a></li>
            <li><form action="#" method="get">
              <input type="text" id="searchInput" placeholder="Enter your search query">
              <button onclick="searchAPI()">Search</button>
            </form></li>
            <li><a href="#"><img class="bell" src="bell.gif" height="50px" width="50px"></a></li>
            <li><a href="#"><img class="wallet" src="wallet.gif" height="50px" width="50px"></a></li>
            <li><a href="#"><img class="cart" src="cart.gif" height="50px" width="50px"></a></li>
            <li><a href="#" style="color: white;">Profile</a></li> <!-- Styled link for Profile -->
        </ul>
    </header>
    <!-- Chart BEGIN -->
    <!-- TradingView Widget BEGIN -->
    <div class="chart-container">
        <div class="tradingview-widget-container" style="height:800px;width:100%">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
            "autosize": true,
            "symbol": "NASDAQ:GOOG",
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "allow_symbol_change": true,
            "calendar": false,
            "width": "100%",
            "height": "100%"
            }
            </script>
        </div>
    </div>
    <!-- TradingView Widget END -->
    <!-- Chart END -->

    <!-- Buy and Sell Buttons -->
    <div style="text-align: center; margin-top: 20px;">
        <input type="submit" class="buy-btn" value="Buy">
        <input type="submit" class="sell-btn" value="Sell">
    </div>

    <!-- Fundamentals and Technicals BEGIN -->
    <div class="widget-container">
        <!-- Fundamentals -->
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container financials-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-financials.js" async>
            {
            "isTransparent": false,
            "largeChartUrl": "",
            "displayMode": "regular",
            "width": "100%",
            "height": 550,
            "colorTheme": "dark",
            "symbol": "NASDAQ:GOOG",
            "locale": "en"
            }
            </script>
        </div>
        <!-- TradingView Widget END -->
        <!-- Technicals -->
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container technicals-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
            {
            "interval": "1m",
            "width": "100%",
            "height": 450,
            "isTransparent": false,
            "symbol": "NASDAQ:GOOG",
            "showIntervalTabs": true,
            "displayMode": "single",
            "locale": "en",
            "colorTheme": "dark"
            }
            </script>
        </div>
        <!-- TradingView Widget END -->
    <!-- Fundamentals and Technicals END -->
    </div>
</body>
</html>
