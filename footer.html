<!DOCTYPE html>

<body>
    <footer>
        <div class="content-box">

                <h1>follow us on</h1>
            </div>
            <div class="content-body">
                
            </div>
            <div class="icons">

                <span><i class="fa fa-twitter" aria-hidden="true"></i></span>
                <span><i class="fa fa-instagram" aria-hidden="true"></i></span>
