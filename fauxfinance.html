<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="Fauxfinance.css">
    <!-- Favicon for the webpage -->
    <link rel="icon" href="TradeTact.png" type="image/x-icon">
    <script src="Fauxfinance.js"> </script>
</head>
<body>
    <!-- Header section of the webpage -->
    <header id="top">
        <!-- Logo image for the website -->
        <img src="logo1.png" alt="Fauxfinance logo" id="logo">
        <div class="topright">
            <!-- Search bar container -->
            <div class="searchbar">     
                <!-- Search bar input field -->
                <input type="text" id="searchbar1" placeholder="        What are you searching for?">
            </div>
            <!-- Login/Register button -->
            <button id="loginbutton">Login/Register</button>
        </div>
    </header>
    
    <!-- Main content section with centered text and image -->
    <pre style="text-align: center; padding-top: 60px">
        <b id="quote">All things finance,
right here.</b>
    </pre>
    <!-- Get started button -->
    <button id="getstarted" onclick="explore()">Get started</button><br>
    <!-- Main image for the homepage -->
    <img src="homepage.jpg" alt="gif" id="homeimg"><br>
    <!-- Button for Stocks & Intraday section with an icon and arrow -->
    <button id="intraday" onclick="stock()">
        <img id="histogram" src="histogram.jpg">
        <span id="stock">Stocks & Intraday</span> 
        <span id="arrow">  &gt;  </span>
    </button>
    
    <!-- Footer section with social media links, address, and contact form -->
    <footer>
        <!-- Follow us section with social media icons -->
        <div class="content-box">
            <div class="content-head">
                <h1>Follow us on</h1>
            </div>
            <div class="content-body"></div>
            <div class="icons">
                <span><i class="fa fa-facebook" aria-hidden="true"></i></span>
                <span><i class="fa fa-twitter" aria-hidden="true"></i></span>
                <span><i class="fa fa-instagram" aria-hidden="true"></i></span>
                <span><i class="fa fa-youtube" aria-hidden="true"></i></span>
            </div>
        </div>
        
        <!-- Address section -->
        <div class="content-box">
            <div class="content-head">
                <h1>Address</h1>
            </div>
            <div class="content-body">
                <p><i class="fa fa-map-marker" aria-hidden="true"></i>
                    <span>Aseb</span> </p>
                <p><i class="fa fa-phone" aria-hidden="true"></i>
                    <span>+911XXXXXXXX</span> </p>
                <p><i class="fa fa-envelope" aria-hidden="true"></i>
                    <span> abc@gmail.com</span> </p>
            </div>
        </div>
        
        <!-- Contact Us section with a form -->
        <div class="content-box">
            <div class="content-head">
                <h1>Contact Us</h1>
            </div>
            <div class="content-body">
                <form action="">
                    <input type="text" placeholder="Enter Name"> <br>
                    <input type="email" placeholder="xyz@gmail.com"> <br>
                    <textarea name="" id="" cols="20" rows="3" placeholder="Enter Message"></textarea><br>
                    <button type="Submit" style="color: black;">Submit</button>
                </form>
            </div>
        </div>
    </footer>
</body>
</html>
