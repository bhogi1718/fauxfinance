<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Market Leaderboard</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0b7fd8;
        margin: 0;
        padding: 0;
        color: #00bbff; /* Changed text color for better visibility */
    }

    header {
        background-color: #02011a;
        color: #fff;
        padding: 20px 0;
        text-align: center;
    }

    .container {
        max-width: 900px;
        margin: 20px auto;
        padding: 0 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border-bottom: 2px solid #ddd;
        padding: 15px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
        color: #333;
        font-weight: bold;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    tr:hover {
        background-color: #e6e6e6;
    }
</style>
<link rel="stylesheet" href="footer.css">
</head>
<body>
<header>
    <h1>Stock Market Leaderboard</h1>
</header>
<div class="container">
    <table id="leaderboard">
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Siddhartha</td>
            <td>$100</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Rithvik</td>
            <td>$90</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Atharva</td>
            <td>$120</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Aman</td>
            <td>$80</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Yashwanth</td>
            <td>$110</td>
        </tr>
    </table>
</div>
</body>
</html>
